<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOVE</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<aside class="sidebar">
  <div class="ws"><span class="ws-icon">B</span>BOVE</div>
  <div class="side-label">Proyecto</div>
  <div id="project-list"></div>
  <button class="side-item side-add" id="new-project">＋ Crear proyecto</button>
  <input class="new-project-input" id="new-project-input" placeholder="Nombre del proyecto y Enter" hidden>
  <div class="side-spacer"></div>
  <div class="user-switch">
    <div class="lbl">Usando la app como</div>
    <div class="users" id="users"></div>
    <button class="reset" id="reset">Restablecer datos de ejemplo</button>
  </div>
</aside>

<main>
  <div class="page">
    <h1 id="page-title"></h1>

    <div class="db-bar">
      <button class="view-tab" data-view="table">▦ Tabla</button>
      <button class="view-tab" data-view="board">▥ Tablero</button>
      <div class="spacer"></div>
      <button class="tool" id="sort-tool" title="Clic para quitar el orden" hidden></button>
      <button class="tool" id="cols-tool" title="Mostrar u ocultar columnas"><svg class="i" viewBox="0 0 16 16"><path d="M5 3.5h6a4.5 4.5 0 0 1 0 9H5a4.5 4.5 0 0 1 0-9zm0 1.5a3 3 0 0 0 0 6h6a3 3 0 0 0 0-6zm6 .75a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5z"/></svg>Propiedades</button>
      <div class="search-box" id="search-box">
        <button class="tool" id="search-tool" title="Buscar"><svg class="i" viewBox="0 0 16 16"><path d="M7 1.5a5.5 5.5 0 0 1 4.4 8.8l3.2 3.2-1.1 1.1-3.2-3.2A5.5 5.5 0 1 1 7 1.5zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg><span class="lbl">Buscar</span></button>
        <input id="search" placeholder="Buscar…" autocomplete="off">
        <button class="mini" id="search-clear" title="Limpiar">×</button>
      </div>
      <button class="btn-new" id="new-task">＋ Nueva</button>
    </div>

    <div class="filter-bar" id="filter-bar" hidden></div>

    <section id="table-view">
      <div class="table-wrap">
        <table id="task-table">
          <colgroup id="colgroup"></colgroup>
          <thead id="thead"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="add-row" id="add-row">＋ Nueva tarea</div>
      <div class="count">CONTAR&nbsp;&nbsp;<span id="count"></span></div>
    </section>

    <section id="board-view" class="board" hidden></section>
  </div>
</main>


<!-- Panel central de la tarea -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-bar">
      <button class="icon-btn" id="close" title="Cerrar (Esc)">✕</button>
      <div class="spacer"></div>
      <button class="icon-btn" id="delete-task" title="Eliminar tarea"></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="popover" id="popover"></div>
<div class="lightbox" id="lightbox"><img alt=""><div class="cap"></div></div>
<div class="toasts" id="toasts"></div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
