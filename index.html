<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOVE</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<aside class="sidebar">
  <div class="ws"><span class="ws-icon">B</span>BOVE</div>
  <div id="sidebar-projects">
    <div class="sec-row">
      <button class="side-label sec-h" data-section="active"><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>Proyectos en curso</button>
      <button class="sec-add" data-add-project="active" title="Crear proyecto en curso">+</button>
    </div>
    <div class="sec-body" data-body="active">
      <input class="new-project-input" data-new-project="active" placeholder="Nombre del proyecto y Enter" hidden>
      <div id="project-list" class="project-list"></div>
    </div>
    <div class="sec-row">
      <button class="side-label sec-h" data-section="archived"><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>Proyectos archivados</button>
      <button class="sec-add" data-add-project="archived" title="Crear proyecto archivado">+</button>
    </div>
    <div class="sec-body" data-body="archived">
      <input class="new-project-input" data-new-project="archived" placeholder="Nombre del proyecto y Enter" hidden>
      <div id="archived-list" class="project-list"></div>
    </div>
  </div>
  <div class="side-spacer"></div>
  <div class="side-foot">
    <button class="account" id="account" title="Cuenta">
      <svg class="i" viewBox="0 0 16 16"><path d="M8 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm0 7.5c3 0 5.5 1.5 5.5 3.5V14h-11v-1c0-2 2.5-3.5 5.5-3.5z"/></svg>
      <span class="acc-name" id="account-name"></span>
      <svg class="chev-ud" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5l3-3 3 3M5 9.5l3 3 3-3"/></svg>
    </button>
  </div>
</aside>

<main>
  <div class="page">
    <h1 id="page-title"></h1>

    <div class="db-bar">
      <button class="view-tab" data-view="table"><svg class="i view-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M1.75 6.25h12.5M1.75 9.75h12.5M8 2.75v10.5"/></svg>Tabla</button>
      <button class="view-tab" data-view="board"><svg class="i view-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M5.9 2.75v10.5M10.1 2.75v10.5"/></svg>Kanban</button>
      <div class="spacer"></div>
      <button class="tool" id="sort-tool" title="Clic para quitar el orden" hidden></button>
      <button class="tool" id="cols-tool" title="Mostrar u ocultar columnas"><svg class="i" viewBox="0 0 16 16"><path d="M5 3.5h6a4.5 4.5 0 0 1 0 9H5a4.5 4.5 0 0 1 0-9zm0 1.5a3 3 0 0 0 0 6h6a3 3 0 0 0 0-6zm6 .75a2.25 2.25 0 1 1 0 4.5 2.25 2.25 0 0 1 0-4.5z"/></svg>Propiedades</button>
      <button class="tool" id="group-tool" title="Elegir cómo se agrupan las columnas del Kanban (por estado, responsable…)"></button>
      <div class="search-box" id="search-box">
        <button class="tool" id="search-tool" title="Buscar"><svg class="i" viewBox="0 0 16 16"><path d="M7 1.5a5.5 5.5 0 0 1 4.4 8.8l3.2 3.2-1.1 1.1-3.2-3.2A5.5 5.5 0 1 1 7 1.5zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg><span class="lbl">Buscar</span></button>
        <input id="search" placeholder="Buscar…" autocomplete="off">
        <button class="mini" id="search-clear" title="Limpiar">×</button>
      </div>
      <button class="btn-new" id="new-task">＋ Nueva</button>
    </div>

    <div class="filter-bar" id="filter-bar" hidden></div>

    <section id="table-view">
      <div class="table-wrap">
        <table id="task-table">
          <colgroup id="colgroup"></colgroup>
          <thead id="thead"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="add-row" id="add-row">＋ Nueva tarea</div>
      <div class="count">RECUENTO&nbsp;&nbsp;<span id="count"></span></div>
    </section>

    <section id="board-view" class="board" hidden></section>
  </div>
</main>


<!-- Panel central de la tarea -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-bar">
      <button class="icon-btn" id="close" title="Cerrar (Esc)">✕</button>
      <div class="spacer"></div>
      <button class="icon-btn" id="delete-task" title="Eliminar tarea"></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="popover" id="popover"></div>
<div class="lightbox" id="lightbox"><img alt=""><div class="cap"></div></div>
<div class="dialog-overlay" id="dialog"><div class="dialog-box" role="dialog" aria-modal="true" id="dialog-body"></div></div>
<div class="logged-out" id="logged-out" hidden>
  <div class="lo-card">
    <div class="ws-icon lo-logo">B</div>
    <h2>Sesión cerrada</h2>
    <p>Esta es una maqueta: el inicio de sesión real llegará con el sistema de cuentas.</p>
    <button class="btn-new" id="login-again">Entrar como Jorge</button>
  </div>
</div>
<div class="confirm-overlay" id="confirm"><div class="confirm-box" role="alertdialog" aria-modal="true" id="confirm-body"></div></div>
<div class="sel-bar" id="sel-bar" hidden></div>
<div class="toasts" id="toasts"></div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
